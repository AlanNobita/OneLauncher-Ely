name: OneLauncher Ely Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ely-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            formats: nsis
            artifact_hint: onelauncher-ely-windows
          - platform: ubuntu-22.04
            formats: deb,appimage
            artifact_hint: onelauncher-ely-linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: (Linux) Install system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            libfuse2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          restore-cache: true
          cache-namespace: ely-release-cache

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Package installer and bundles
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS="--release --formats ${{ matrix.formats }}"
          cargo packager $ARGS --verbose

      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          shopt -s nullglob globstar
          {
            echo 'files<<EOF'
            find target/release -maxdepth 1 -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) -print
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_hint }}
          path: ${{ steps.artifacts.outputs.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Generate updater metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib

          root = pathlib.Path('dist')
          files = [path for path in root.rglob('*') if path.is_file()]

          def one(predicate, description):
              matches = [path for path in files if predicate(path)]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one {description}; found {matches}')
              return matches[0]

          appimage = one(lambda p: p.name.endswith('.AppImage'), 'AppImage')
          installer = one(lambda p: p.name.endswith('-setup.exe'), 'Windows NSIS installer')
          appimage_sig = appimage.with_name(appimage.name + '.sig')
          installer_sig = installer.with_name(installer.name + '.sig')

          if not appimage_sig.is_file():
              raise SystemExit(f'missing signature: {appimage_sig}')
          if not installer_sig.is_file():
              raise SystemExit(f'missing signature: {installer_sig}')

          tag = __import__('os').environ['TAG']
          repository = __import__('os').environ['REPOSITORY']
          version = tag[1:] if tag.startswith('v') else tag
          base = f'https://github.com/{repository}/releases/download/{tag}'
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          metadata = {
              'version': version,
              'notes': 'OneLauncher Ely update. See the release notes for the full changelog.',
              'pub_date': now,
              'platforms': {
                  'linux-x86_64': {
                      'signature': appimage_sig.read_text(),
                      'url': f'{base}/{appimage.name}',
                      'format': 'appimage',
                  },
                  'windows-x86_64': {
                      'signature': installer_sig.read_text(),
                      'url': f'{base}/{installer.name}',
                      'format': 'nsis',
                  },
              },
          }
          (root / 'latest.json').write_text(json.dumps(metadata, separators=(',', ':')) + '\n')
          print(f'write latest.json for {version}')
          PY

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          find . -type f | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneLauncher Ely ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/**/*
            dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0') }}
          generate_release_notes: true
          body: |
            ## OneLauncher Ely ${{ github.ref_name }}

            Unofficial community fork of Polyfrost/OneLauncher.

            ### Downloads
            Windows: `*_x64-setup.exe` — not Authenticode-signed. SmartScreen may warn; choose *More info → Run anyway*.
            Linux: `.deb` for Debian/Ubuntu or `.AppImage` otherwise.
            SHA-256 checksums are in **SHA256SUMS.txt**.

            ### Added in this fork
            - Offline accounts (MD5 `OfflinePlayer:` UUID)
            - Ely.by accounts via authlib-injector
            - Debian/AppImage packaging
            - Ely.by and offline accounts can use Poly+ social features (friends, chat, party, world hosting) against a self-hosted instance — set a custom Poly+ endpoint in Settings → APIs
            - Mods can be disabled and removed straight from the Browse tab, including mods that came from a bundle

            ### Fixed
            - Setting a local skin or cape no longer crashes the launcher (a hook-order bug that left the app unable to start)
